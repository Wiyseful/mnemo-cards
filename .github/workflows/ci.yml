name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0

      - name: Install packages
        run: npm ci

      - name: Run tests (C++, WebAssembly build, TypeScript)
        run: npm test

      - name: Check types
        run: npx tsc --noEmit

      - name: Build the app
        run: npm run build